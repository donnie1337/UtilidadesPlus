name: Build UtilidadesPlus

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Validar ambiente Java e Maven
        run: |
          set -euo pipefail
          echo '=== java -version ==='
          java -version
          echo '=== javac -version ==='
          javac -version
          echo '=== mvn -version ==='
          mvn -version
          echo '=== JAVA_HOME ==='
          echo "$JAVA_HOME"

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload plugin JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UtilidadesPlus
          path: target/*.jar
          if-no-files-found: error

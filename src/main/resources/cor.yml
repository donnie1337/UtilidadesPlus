# =========================================
#              CORES DO /COR
# =========================================
# Este arquivo controla somente a cor da mensagem enviada no chat.
# NÃO altera a cor do nickname, do cargo ou do TAB.

ativado: true

# Permissão exigida para abrir/usar o sistema.
permission: cargoplus.cor

# Cor usada quando o jogador ainda não possui uma escolha válida.
default-color: branco

# Paleta disponível no /cor.
# preto não faz parte da paleta.
colors:
  branco: "&f"
  cinza: "&7"
  vermelho: "&c"
  vermelho-escuro: "&4"
  verde: "&a"
  verde-escuro: "&2"
  azul: "&9"
  azul-claro: "&b"
  amarelo: "&e"
  dourado: "&6"
  rosa: "&d"
  roxo: "&5"
  aqua: "&3"

gui:
  ativado: true
  titulo: "&8Selecione a cor da sua mensagem"
  tamanho: 36
  close-after-selection: true

  # Slots usados pelos itens de cor.
  slots:
    - 10
    - 11
    - 12
    - 13
    - 14
    - 15
    - 16
    - 19
    - 20
    - 21
    - 22
    - 23
    - 24

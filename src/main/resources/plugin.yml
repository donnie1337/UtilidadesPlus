name: UtilidadesPlus
version: '1.0.0'
main: com.sistemautil.SistemaUtil
api-version: '26.2'
author: donnie1337
description: Utilidades do servidor, incluindo MOTD e preferências de entrada/saída.
softdepend:
  - CargoPlus
commands:
  motdplus:
    description: Recarrega a configuração do MOTD.
    usage: /motdplus reload
    aliases:
      - motd
    permission: utilidadesplus.motd.admin
  configurar:
    description: Abre o menu de configuração das utilidades pessoais.
    usage: /configurar
permissions:
  utilidadesplus.motd.admin:
    description: Permite recarregar a configuração do MOTD.
    default: op
  utilidadesplus.configurar:
    description: Permite abrir o menu /configurar.
    default: false
  utilidadesplus.cor:
    description: Permite usar o sistema de cores das mensagens.
    default: false

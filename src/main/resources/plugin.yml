name: SistemaUtil
version: '1.0.0'
main: com.sistemautil.SistemaUtil
api-version: '26.2'
author: donnie1337
description: Utilidades do servidor, incluindo MOTD.
softdepend:
  - CargoPlus
commands:
  motdplus:
    description: Recarrega a configuração do MOTD.
    usage: /motdplus reload
    aliases:
      - motd
    permission: sistemautil.motd.admin
permissions:
  sistemautil.motd.admin:
    description: Permite recarregar a configuração do MOTD.
    default: op

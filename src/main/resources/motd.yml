# =========================================
#                 MOTD
# =========================================
# A formatação visual é processada pelo UtilidadesPlus.
# Suporta {icon:nome}, <#RRGGBB> e <gradient:#RRGGBB:#RRGGBB>texto</gradient>.

ativado: true
animado: true
intervalo-segundos: 4

# Separador usado para dividir a MOTD em duas linhas.
# Exemplo: linha 1|linha 2
formato:
  separador: "|"

# Placeholders dinâmicos usados nas linhas abaixo.
# Você pode alterar o formato de hora/data sem mexer no código.
placeholders:
  hora:
    formato: "HH:mm"
  data:
    formato: "dd/MM/yyyy"

# Use | para separar a linha 1 da linha 2.
linhas:
  - "<gradient:#B19CD8:#BEA9DF>&lREDE EDGE</gradient> &8• &fredeedge.com &8• &7[1.21 - 26.3]|&aPROTEJA SEU TERRENO &f&l& &eJogue com seus amigos!"
  - "<gradient:#B19CD8:#BEA9DF>&lREDE EDGE</gradient> &8• &fredeedge.com &8• &7[1.21 - 26.3]|&4{icon:espada} &cA LUA SANGRENTA CHEGOU! &4[NOVO]"
  - "<gradient:#B19CD8:#BEA9DF>&lREDE EDGE</gradient> &8• &fredeedge.com &8• &7[1.21 - 26.3]|&eMERCADO DOS JOGADORES: &dDomine a economia!"
# Ícone 64x64 dentro da pasta do plugin.
# Desativado por padrão porque nenhum icon.png acompanha o JAR.
icone:
  ativado: false
  formato: png
  arquivo: icon.png

# Permite exibir um número fictício de jogadores no MOTD.
jogadores-ficticios:
  ativado: false
  max: 9999

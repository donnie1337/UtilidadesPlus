# =========================================
#                 MOTD
# =========================================
# A formatação visual é processada pelo UtilidadesPlus.
# Suporta {icon:nome}, <#RRGGBB> e <gradient:#RRGGBB:#RRGGBB>texto</gradient>.

ativado: true
animado: true
intervalo-segundos: 4

# Separador usado para dividir a MOTD em duas linhas.
# Exemplo: linha 1|linha 2
formato:
  separador: "|"

# Placeholders dinâmicos usados nas linhas abaixo.
# Você pode alterar o formato de hora/data sem mexer no código.
placeholders:
  hora:
    formato: "HH:mm"
  data:
    formato: "dd/MM/yyyy"

# Use | para separar a linha 1 da linha 2.
linhas:
  - "&e&lREDE GLOW &8• &f&://redeglow.com &7• &7&l[1.18 - 26.2]|&d&lPROTEJA SEU TERRENO &f&l& &eJogue com seus amigos sem preocupações!"
  - "&e&lREDE GLOW &8• &f&://redeglow.com &7• &7&l[1.18 - 26.2]|&c&lA {icon:espada} LUA SANGRENTA CHEGOU! &eVocê consegue sobreviver à noite? &4&l[NOVO]"
  - "&e&lREDE GLOW &8• &f&://redeglow.com &7• &7&l[1.18 - 26.2]|&e&lMERCADO DOS JOGADORES: &dCrie sua loja e domine a economia!s"
  - "&e&lREDE GLOW &8• &f&://redeglow.com &7• &7&l[1.18 - 26.2]|&e&l{icon:online} FAZENDAS E PETS: &fAdote um companheiro e crie sua vila pacífica."
# Ícone 64x64 dentro da pasta do plugin.
# Desativado por padrão porque nenhum icon.png acompanha o JAR.
icone:
  ativado: false
  formato: png
  arquivo: icon.png

# Permite exibir um número fictício de jogadores no MOTD.
jogadores-ficticios:
  ativado: false
  max: 9999

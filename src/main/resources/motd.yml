# =========================================
#                 MOTD
# =========================================
# Configuração exclusiva da lista do servidor (MOTD).

ativado: true
animado: true
intervalo-segundos: 4

# Use | para separar a linha 1 da linha 2.
linhas:
  - "&6&lMeu Servidor &7- &fBem-vindo(a)!|&aOnline: %online%/%max% jogadores"
  - "&b&lVersao %versao% &7- &fVenha se divertir!|&eHorario do servidor: %hora%"
  - "&d&lDiscord: &fdiscord.gg/exemplo|&7TPS atual: %tps% &7- &fVagas: %vagas%"

# Ícone 64x64 dentro da pasta do plugin.
icone:
  ativado: true
  formato: png
  arquivo: icon.png

# Permite exibir um número fictício de jogadores no MOTD.
jogadores-ficticios:
  ativado: false
  max: 9999

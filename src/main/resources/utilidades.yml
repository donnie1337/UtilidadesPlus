# ============================================================
# UtilidadesPlus - Preferências do jogador
# ============================================================
# Configurações pessoais usadas pelo /configurar.
# As mensagens e textos exibidos aos jogadores não são alterados aqui.
# As chaves técnicas existentes são preservadas para compatibilidade.
# ============================================================

# ------------------------------------------------------------
# IDENTIDADE VISUAL
# ------------------------------------------------------------
identidade-visual:
  ativado: true
  # Conversão para small caps usada nos elementos visuais.
  small-caps:
    ativado: true
    mapa-maiusculas: "ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢ"
    mapa-minusculas: "ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢ"
  # Gradiente usado na identidade visual.
  gradient:
    ativado: true
    inicio: "#7C3AED"
    fim: "#22D3EE"
  # Ícones disponíveis para os formatos do plugin.
  icones:
    ativado: true
    lista:
      estrela: "★"
      estrela-vazia: "☆"
      picareta: "⛏"
      espada: "⚔"
      coracao: "❤"
      raio: "⚡"
      fogo: "🔥"
      moeda: "✦"
      cifrao: "$"
      online: "●"
      offline: "●"
      seta: "➜"
      check: "✔"
      x: "✖"
      cadeado: "🔒"
      trofeu: "🏆"

# ------------------------------------------------------------
# NOTIFICAÇÕES RECEBIDAS
# ------------------------------------------------------------
receber:
  entrada: true
  saida: true
  tpa: true
  tell: true

# ------------------------------------------------------------
# INTERFACE DO /CONFIGURAR
# ------------------------------------------------------------
gui:
  ativado: true
  titulo: '&8Utilidades do jogador'
  tamanho: 27
  slots:
    teletransporte: 11
    mensagens: 15
    receber-tpa: 11
    receber-tell: 15
    entrada: 11
    notificacoes: 15
    cor: 13

# ------------------------------------------------------------
# MENSAGENS DE ENTRADA
# ------------------------------------------------------------
# O CargoPlus fornece o cargo. O UtilidadesPlus apenas o exibe.
# Placeholders: %player% = jogador | %cargo% = cargo do CargoPlus.
mensagens-entrada:
  ativado: true
  mensagens:
    - "%cargo%%player% olha quem apareceu!"
    - "%cargo%%player% acabou de chegar!"
    - "%cargo%%player% está entre nós!"
    - "%cargo%%player% chegou chegando!"
    - "%cargo%%player% deu as caras por aqui!"

# ------------------------------------------------------------
# MENSAGEM DE SAÍDA
# ------------------------------------------------------------
mensagens-saida:
  ativado: false
  mensagem: "%cargo%%player% saiu do servidor!"

# Preferências individuais dos jogadores.
jogadores: {}

# =========================================
#             UTILIDADES / CONFIGURAR
# =========================================
# Preferências pessoais dos jogadores.
# Entrada/saída são notificações recebidas pelo próprio jogador.

# =========================================
#           IDENTIDADE VISUAL
# =========================================
# Esta seção é compartilhada por MOTD, TAB e pelas integrações de chat,
# scoreboard e GUI. Não é necessário instalar plugin de fontes.
#
# Small Caps usa Unicode e, portanto, não exige resource pack.
# Gradientes usam RGB real (§x), compatível com clientes 1.16+.
# Ícones podem começar como Unicode e futuramente ser trocados por glyphs
# de resource pack sem alterar as configurações dos outros sistemas.
identidade-visual:
  ativado: true

  small-caps:
    ativado: true
    mapa-maiusculas: "ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢ"
    mapa-minusculas: "ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢ"

  gradient:
    ativado: true
    inicio: "#7C3AED"
    fim: "#22D3EE"

  icones:
    ativado: true
    lista:
      estrela: "★"
      estrela-vazia: "☆"
      picareta: "⛏"
      espada: "⚔"
      coracao: "❤"
      raio: "⚡"
      fogo: "🔥"
      moeda: "✦"
      cifrao: "$"
      online: "●"
      offline: "●"
      seta: "➜"
      check: "✔"
      x: "✖"
      cadeado: "🔒"
      trofeu: "🏆"

receber:
  entrada: true
  saida: true

gui:
  ativado: true
  titulo: '&8Utilidades do jogador'
  tamanho: 27
  slots:
    entrada: 11
    saida: 15
    cor: 13

# Mensagens de entrada por cargo.
# Somente os cargos com ativado: true exibem uma mensagem quando um jogador desse cargo entra.
# As 5 frases abaixo são escolhidas aleatoriamente para cada entrada.
# Placeholders: %player% = nome do jogador | %cargo% = nome exibido do cargo.
mensagens-entrada:
  membro:
    ativado: false
    mensagens:
      - "[%cargo%] %player% olha quem apareceu!"
      - "[%cargo%] %player% acabou de chegar!"
      - "[%cargo%] %player% está entre nós!"
      - "[%cargo%] %player% chegou chegando!"
      - "[%cargo%] %player% deu as caras por aqui!"

# ============================================================
# UtilidadesPlus - Preferências do jogador
# ============================================================
# Configurações pessoais usadas pelo /configurar.
# As mensagens e textos exibidos aos jogadores não são alterados aqui.
# As chaves técnicas existentes são preservadas para compatibilidade.
# ============================================================

# ------------------------------------------------------------
# IDENTIDADE VISUAL
# ------------------------------------------------------------
identidade-visual:
  ativado: true
  small-caps:
    ativado: true
    mapa-maiusculas: "ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢ"
    mapa-minusculas: "ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢ"
  gradient:
    ativado: true
    inicio: "#7C3AED"
    fim: "#22D3EE"
  icones:
    ativado: true
    lista:
      estrela: "★"
      estrela-vazia: "☆"
      picareta: "⛏"
      espada: "⚔"
      coracao: "❤"
      raio: "⚡"
      fogo: "🔥"
      moeda: "✦"
      cifrao: "$"
      online: "●"
      offline: "●"
      seta: "➜"
      check: "✔"
      x: "✖"
      cadeado: "🔒"
      trofeu: "🏆"

# ------------------------------------------------------------
# NOTIFICAÇÕES RECEBIDAS
# ------------------------------------------------------------
receber:
  entrada: true
  saida: true
  tpa: true
  tell: true
  convites-clan: true
  pedidos-casamento: true

# ------------------------------------------------------------
# INTERFACE DO /CONFIGURAR
# ------------------------------------------------------------
# Toda a aparência dos menus pode ser alterada aqui:
# - título e tamanho de cada tela
# - slot, material, nome e lore de cada item
# - textos de status e ação dos botões
# - mensagens enviadas ao clicar nas opções
gui:
  ativado: true

  textos:
    status-ativado: "&7Estado: &aAtivado"
    status-desativado: "&7Estado: &cDesativado"
    acao-ativar: "&eClique para ativar"
    acao-desativar: "&eClique para desativar"

  mensagens:
    mensagem-tpa-ativado: "&b[Tpa] &aVocê agora pode receber solicitações de TPA."
    mensagem-tpa-desativado: "&b[Tpa] &cVocê não receberá mais solicitações de TPA."
    mensagem-tell-ativado: "&e[Chat] &aVocê agora pode receber mensagens privadas."
    mensagem-tell-desativado: "&e[Chat] &cVocê não receberá mais mensagens privadas."
    mensagem-clan-ativado: "&aVocê agora pode receber convites de clan."
    mensagem-clan-desativado: "&cVocê não receberá mais convites de clan."
    mensagem-casamento-ativado: "&aVocê agora pode receber pedidos de casamento."
    mensagem-casamento-desativado: "&cVocê não receberá mais pedidos de casamento."
    mensagem-entrada-ativada: "&aSuas mensagens de entrada/saída agora são visíveis para todos."
    mensagem-entrada-desativada: "&cSuas mensagens de entrada/saída foram ocultadas dos outros jogadores."
    mensagem-notificacoes-ativadas: "&aNotificações de entrada/saída ativadas."
    mensagem-notificacoes-desativadas: "&cNotificações de entrada/saída desativadas."

  telas:
    principal:
      titulo: "&8Utilidades do jogador"
      tamanho: 27
      itens:
    
    jogabilidade:
      titulo: "&8Jogabilidade"
      tamanho: 36
      itens:
        confirmar-terreno:
          slot: 10
          material: "TNT"
          nome: "&cConfirmar remoção de terreno"
          lore:
            - ""
            - "&7Solicita confirmação antes de"
            - "&7remover um terreno protegido."
            - ""
            - "{status}"
            - ""
            - "{acao}"
        confirmar-divorcio:
          slot: 12
          material: "RED_DYE"
          nome: "&dConfirmar divórcio"
          lore:
            - ""
            - "&7Solicita confirmação antes de"
            - "&7encerrar um casamento."
            - ""
            - "{status}"
            - ""
            - "{acao}"
        confirmar-clan:
          slot: 14
          material: "SHIELD"
          nome: "&cConfirmar exclusão de clan"
          lore:
            - ""
            - "&7Solicita confirmação antes de"
            - "&7excluir sua clan."
            - ""
            - "{status}"
            - ""
            - "{acao}"
        ordenar-terrenos:
          slot: 16
          material: "GRASS_BLOCK"
          nome: "&aOrdenação de terrenos"
          lore:
            - ""
            - "&7Opção atual: {valor}"
            - ""
            - "&7Define a ordem exibida na"
            - "&7lista de terrenos."
            - ""
            - "&eClique para alterar"
        ordenar-homes:
          slot: 22
          material: "COMPASS"
          nome: "&aOrdenação de homes"
          lore:
            - ""
            - "&7Opção atual: {valor}"
            - ""
            - "&7Define a ordem das homes"
            - "&7exibidas no menu."
            - ""
            - "&eClique para alterar"
        voltar:
          slot: 31
          material: "ARROW"
          nome: "&cVoltar"
          lore:
            - ""
            - "&7Clique para voltar às configurações."

    teletransporte:
          slot: 11
          material: "OAK_BOAT"
          nome: "&bTeletransporte"
          lore:
            - ""
            - "&7Gerencie quem pode enviar"
            - "&7solicitações e mensagens privadas."
            - ""
            - "&eClique para configurar"
        limites:
          slot: 13
          material: "HOPPER"
          nome: "&6Limites"
          lore:
            - ""
            - "&7Consulte os limites que protegem"
            - "&7o desempenho do servidor."
            - ""
            - "&eClique para visualizar"
        mensagens:
          slot: 15
          material: "COMPASS"
          nome: "&eMensagens de entrada"
          lore:
            - ""
            - "&7Personalize mensagens, notificações"
            - "&7e a cor usada no chat."
            - ""
            - "&eClique para configurar"
        jogabilidade:
          slot: 22
          material: "COMPARATOR"
          nome: "&dJogabilidade"
          lore:
            - ""
            - "&7Configure confirmações e"
            - "&7ordenação dos seus menus."
            - ""
            - "&eClique para configurar"

    teletransporte:
      titulo: "&8Teletransporte e comunicação"
      tamanho: 36
      itens:
        receber-tpa:
          slot: 10
          material: "OAK_BOAT"
          nome: "&bReceber TPA"
          lore:
            - ""
            - "&7Escolha se outros jogadores podem"
            - "&7enviar solicitações de TPA para você."
            - ""
            - "{status}"
            - ""
            - "{acao}"
        receber-tell:
          slot: 12
          material: "PAPER"
          nome: "&eReceber /tell"
          lore:
            - ""
            - "&7Escolha se outros jogadores podem"
            - "&7enviar mensagens privadas para você."
            - ""
            - "{status}"
            - ""
            - "{acao}"
        receber-clan:
          slot: 14
          material: "SHIELD"
          nome: "&aReceber convites de clan"
          lore:
            - ""
            - "&7Escolha se você deseja receber"
            - "&7convites enviados por clans."
            - ""
            - "{status}"
            - ""
            - "{acao}"
        receber-casamento:
          slot: 16
          material: "PINK_DYE"
          nome: "&dReceber pedidos de casamento"
          lore:
            - ""
            - "&7Escolha se você deseja receber"
            - "&7pedidos de casamento de jogadores."
            - ""
            - "{status}"
            - ""
            - "{acao}"
        voltar:
          slot: 31
          material: "ARROW"
          nome: "&cVoltar"
          lore:
            - ""
            - "&7Clique para voltar às configurações."

    mensagens:
      titulo: "&8Mensagens de entrada"
      tamanho: 36
      itens:
        entrada:
          slot: 11
          material: "OAK_DOOR"
          nome: "&eMensagens de entrada/saída"
          lore:
            - ""
            - "&7Escolha se sua entrada e saída"
            - "&7serão anunciadas aos jogadores."
            - ""
            - "{status}"
            - ""
            - "{acao}"
        cor:
          slot: 13
          material: ""
          nome: "&fCor da mensagem"
          lore:
            - ""
            - "&7Cor atual: {cor}{nome-cor}"
            - ""
            - "&7Define a cor das suas mensagens"
            - "&7enviadas pelo chat."
            - ""
            - "&eClique para escolher uma cor"
        notificacoes:
          slot: 15
          material: "ENDER_EYE"
          nome: "&bNotificações de entrada/saída"
          lore:
            - ""
            - "&7Escolha se você deseja receber"
            - "&7avisos de entrada e saída."
            - ""
            - "{status}"
            - ""
            - "{acao}"
        voltar:
          slot: 31
          material: "ARROW"
          nome: "&cVoltar"
          lore:
            - ""
            - "&7Clique para voltar às configurações."

# ------------------------------------------------------------
# MENSAGENS DE ENTRADA
# ------------------------------------------------------------
mensagens-entrada:
  ativado: true
  mensagens:
    - "%cargo%%player% olha quem apareceu!"
    - "%cargo%%player% acabou de chegar!"
    - "%cargo%%player% está entre nós!"
    - "%cargo%%player% chegou chegando!"
    - "%cargo%%player% deu as caras por aqui!"

# ------------------------------------------------------------
# MENSAGEM DE SAÍDA
# ------------------------------------------------------------
mensagens-saida:
  ativado: false
  mensagem: "%cargo%%player% saiu do servidor!"

jogadores: {}

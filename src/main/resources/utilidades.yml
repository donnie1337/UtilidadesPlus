# ============================================================
# UtilidadesPlus - Preferências do jogador
# ============================================================
# Configurações pessoais usadas pelo /configurar.
# As mensagens e textos exibidos aos jogadores não são alterados aqui.
# As chaves técnicas existentes são preservadas para compatibilidade.
# ============================================================

# ------------------------------------------------------------
# IDENTIDADE VISUAL
# ------------------------------------------------------------
identidade-visual:
  ativado: true
  small-caps:
    ativado: true
    mapa-maiusculas: "ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢ"
    mapa-minusculas: "ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢ"
  gradient:
    ativado: true
    inicio: "#7C3AED"
    fim: "#22D3EE"
  icones:
    ativado: true
    lista:
      estrela: "★"
      estrela-vazia: "☆"
      picareta: "⛏"
      espada: "⚔"
      coracao: "❤"
      raio: "⚡"
      fogo: "🔥"
      moeda: "✦"
      cifrao: "$"
      online: "●"
      offline: "●"
      seta: "➜"
      check: "✔"
      x: "✖"
      cadeado: "🔒"
      trofeu: "🏆"

# ------------------------------------------------------------
# NOTIFICAÇÕES RECEBIDAS
# ------------------------------------------------------------
receber:
  entrada: true
  saida: true
  tpa: true
  tell: true

# ------------------------------------------------------------
# INTERFACE DO /CONFIGURAR
# ------------------------------------------------------------
# Toda a aparência dos menus pode ser alterada aqui:
# - título e tamanho de cada tela
# - slot, material, nome e lore de cada item
# - textos de status e ação dos botões
# - mensagens enviadas ao clicar nas opções
gui:
  ativado: true

  textos:
    status-ativado: "&a● ATIVADO"
    status-desativado: "&c● DESATIVADO"
    acao-ativar: "&8Clique para ativar."
    acao-desativar: "&8Clique para desativar."

  mensagens:
    mensagem-tpa-ativado: "&b&lᴛᴘᴀ &8• &aVocê agora pode receber solicitações de TPA."
    mensagem-tpa-desativado: "&b&lᴛᴘᴀ &8• &cVocê não receberá mais solicitações de TPA."
    mensagem-tell-ativado: "&e&lᴄʜᴀᴛ &8• &aVocê agora pode receber mensagens privadas."
    mensagem-tell-desativado: "&e&lᴄʜᴀᴛ &8• &cVocê não receberá mais mensagens privadas."
    mensagem-entrada-ativada: "&aSuas mensagens de entrada/saída agora são visíveis para todos."
    mensagem-entrada-desativada: "&cSuas mensagens de entrada/saída foram ocultadas dos outros jogadores."
    mensagem-notificacoes-ativadas: "&aNotificações de entrada/saída ativadas."
    mensagem-notificacoes-desativadas: "&cNotificações de entrada/saída desativadas."

  telas:
    principal:
      titulo: "&8Utilidades do jogador"
      tamanho: 27
      itens:
        teletransporte:
          slot: 11
          material: "OAK_BOAT"
          nome: "&b&lTeletransporte"
          lore:
            - ""
            - "&7Controle solicitações de TPA"
            - "&7e mensagens privadas."
            - ""
            - "&eClique para abrir."
        limites:
          slot: 13
          material: "HOPPER"
          nome: "&6&lLimites"
          lore:
            - ""
            - "&7Veja os limites de desempenho"
            - "&7do servidor."
            - ""
            - "&eClique para abrir."
        mensagens:
          slot: 15
          material: "COMPASS"
          nome: "&e&lMensagens de entrada"
          lore:
            - ""
            - "&7Configure suas mensagens,"
            - "&7notificações e cor do chat."
            - ""
            - "&eClique para abrir."

    teletransporte:
      titulo: "&8Teletransporte e comunicação"
      tamanho: 27
      itens:
        receber-tpa:
          slot: 11
          material: "OAK_BOAT"
          nome: "&b&lReceber TPA"
          lore:
            - ""
            - "&7Permite que outros jogadores"
            - "&7enviem solicitações de TPA para você."
            - ""
            - "{status}"
            - "{acao}"
        receber-tell:
          slot: 15
          material: "PAPER"
          nome: "&e&lReceber /tell"
          lore:
            - ""
            - "&7Permite que outros jogadores"
            - "&7enviem mensagens privadas para você."
            - ""
            - "{status}"
            - "{acao}"
        voltar:
          slot: 22
          material: "ARROW"
          nome: "&fVoltar"
          lore:
            - "&7Voltar para configurações."

    mensagens:
      titulo: "&8Mensagens de entrada"
      tamanho: 27
      itens:
        entrada:
          slot: 11
          material: "OAK_DOOR"
          nome: "&e&lMensagens de entrada/saída"
          lore:
            - ""
            - "&7Controla se sua entrada e saída"
            - "&7podem ser exibidas para os jogadores."
            - ""
            - "{status}"
            - "{acao}"
        cor:
          slot: 13
          material: ""
          nome: "&fCor da mensagem"
          lore:
            - ""
            - "&7Sua cor atual:"
            - "&f▸ {cor}{nome-cor}"
            - ""
            - "&7Escolha uma nova cor para"
            - "&7as suas mensagens no chat."
            - ""
            - "&eClique para abrir as cores."
        notificacoes:
          slot: 15
          material: "ENDER_EYE"
          nome: "&b&lNotificações de entrada/saída"
          lore:
            - ""
            - "&7Controla se você recebe as"
            - "&7mensagens de entrada e saída."
            - ""
            - "{status}"
            - "{acao}"
        voltar:
          slot: 22
          material: "ARROW"
          nome: "&fVoltar"
          lore:
            - "&7Voltar para configurações."

# ------------------------------------------------------------
# MENSAGENS DE ENTRADA
# ------------------------------------------------------------
mensagens-entrada:
  ativado: true
  mensagens:
    - "%cargo%%player% olha quem apareceu!"
    - "%cargo%%player% acabou de chegar!"
    - "%cargo%%player% está entre nós!"
    - "%cargo%%player% chegou chegando!"
    - "%cargo%%player% deu as caras por aqui!"

# ------------------------------------------------------------
# MENSAGEM DE SAÍDA
# ------------------------------------------------------------
mensagens-saida:
  ativado: false
  mensagem: "%cargo%%player% saiu do servidor!"

jogadores: {}

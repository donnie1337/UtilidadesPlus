# =========================================
#             UTILIDADES /CONFIGURAR
# =========================================
# Preferências pessoais dos jogadores.
# Entrada/saída são notificações recebidas pelo próprio jogador.

receber:
  entrada: true
  saida: true

gui:
  ativado: true
  titulo: '&8Utilidades do jogador'
  tamanho: 27
  slots:
    entrada: 11
    saida: 15
    cor: 13

# Mensagens de entrada e saída do servidor.
# A cor da mensagem é aplicada automaticamente conforme o cargo do jogador.
# As mensagens de entrada são escolhidas aleatoriamente da lista.
entrada:
  ativado: true
  mensagens:
    - 'entrou no servidor!'
    - 'acabou de chegar no servidor!'
    - 'está online!'
    - 'voltou para o servidor!'
    - 'chegou para jogar!'
    - 'entrou na aventura!'
    - 'está de volta!'

saida:
  ativado: false

mensagens:
  entrada: '&8[&a+&8] %prefix%%nome-color%%nome% &7entrou no servidor!'
  saida: '&8[&c-&8] %prefix%%nome-color%%nome% &7saiu do servidor!'

# Preferências individuais ficam abaixo de jogadores.
jogadores: {}

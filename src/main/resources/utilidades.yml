# =========================================
#             UTILIDADES / CONFIGURAR
# =========================================
# Preferências pessoais dos jogadores.
# Entrada/saída são notificações recebidas pelo próprio jogador.

# =========================================
#           IDENTIDADE VISUAL
# =========================================
identidade-visual:
  ativado: true
  small-caps:
    ativado: true
    mapa-maiusculas: "ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢ"
    mapa-minusculas: "ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢ"
  gradient:
    ativado: true
    inicio: "#7C3AED"
    fim: "#22D3EE"
  icones:
    ativado: true
    lista:
      estrela: "★"
      estrela-vazia: "☆"
      picareta: "⛏"
      espada: "⚔"
      coracao: "❤"
      raio: "⚡"
      fogo: "🔥"
      moeda: "✦"
      cifrao: "$"
      online: "●"
      offline: "●"
      seta: "➜"
      check: "✔"
      x: "✖"
      cadeado: "🔒"
      trofeu: "🏆"

receber:
  entrada: true
  saida: true

gui:
  ativado: true
  titulo: '&8Utilidades do jogador'
  tamanho: 27
  slots:
    entrada: 11
    saida: 15
    cor: 13

# Mensagens de entrada.
# O CargoPlus define o cargo do jogador. O UtilidadesPlus apenas lê o cargo.
# Uma frase é escolhida aleatoriamente para qualquer cargo.
# Placeholders: %player% = nome do jogador | %cargo% = cargo vindo do CargoPlus.
mensagens-entrada:
  ativado: true
  mensagens:
    - "%cargo% %player% olha quem apareceu!"
    - "%cargo% %player% acabou de chegar!"
    - "%cargo% %player% está entre nós!"
    - "%cargo% %player% chegou chegando!"
    - "%cargo% %player% deu as caras por aqui!"

# Mensagem de saída para qualquer cargo.
# O CargoPlus define o cargo do jogador. O UtilidadesPlus apenas lê o cargo.
mensagens-saida:
  ativado: false
  mensagem: "%cargo% %player% saiu do servidor!"

jogadores: {}

# ============================================================
# UtilidadesPlus - TAB
# ============================================================
# Header e footer configuráveis.
# ============================================================

ativado: true

# ============================================================
# HEADER
# ============================================================

header-ativado: true

header: |
  &8
  &b❄&e&k!&r <gradient:#FFD54F:#FF8F00>&lREDE GLOW</gradient>&r &e&k!&r&b❄
  &8
  &fJogadores Online: &b%online%&7/&3500 &8| &fPing: &a%player_ping%ms

# ============================================================
# FOOTER
# ============================================================

footer-ativado: true

footer: |
  &8
  &a&lEVENTO ATIVO: &eDobro de Coins habilitado até às 22h!
  &8
     &f🛸 Site: &aredeglow.com&r &8| &f🛒 Loja: &aloja.redeglow.com &7(Adquira VIPs e Cosméticos)   
  &f💬 Discord: &ddiscord.gg/redeglow&r &7(Suporte & Avisos)
  &8
  &7Obrigado por jogar conosco hoje, &d%player_name%&7!

# ============================================================
# NOMES DOS JOGADORES
# ============================================================

jogadores:
  formato: "%prefix%%name_color%<small>%player_name%</small>%habilidade_tag%%clan_tag%"

# ============================================================
# TAG / CLAN
# ============================================================

tag:
  ativada: true
  mostrar-no-tab: true

  cabeca:
    ativada: true
    formato: "%prefixo%%name_color%%player_name%%clan%%invisivel%"

    prefixo:
      formato: "%prefix%"

    nome:
      formato: "%name_color%%player_name%"

    clan:
      formato: " &r%clan_tag%"

    invisivel:
      ativado: true
      abaixo-do-nome: true
      centralizar-automaticamente: true
      espacos-extra: 0
      espacos-centralizacao: "       "
      formato: " &r%vanish_suffix%"
      texto: "[INVISIVEL]"
      cor: "&c"

# ============================================================
# ORDENAÇÃO DOS JOGADORES
# ============================================================

sorting:
  enabled: true
  case-sensitive: false

  rules:
    - type: primary-group
      order: ascending

    - type: placeholder
      placeholder: "%player_name%"
      order: ascending
      case-sensitive: false

# ============================================================
# ENDEREÇO DO SERVIDOR
# ============================================================

endereco-servidor: ""

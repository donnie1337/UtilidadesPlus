# ============================================================
# UtilidadesPlus - TAB
# ============================================================
# Toda a aparência do TAB pode ser alterada neste arquivo.
#
# Small Caps é opcional e só é aplicado dentro de <small>...</small>.
# Você pode misturar texto normal e Small Caps na mesma linha.
# Você pode alterar textos, cores, linhas e placeholders sem precisar editar o código Java.
#
# Cores: &a, &b, &c...
# Gradiente: <gradient:#7C3AED:#22D3EE>texto</gradient>
# Ícones: {icon:nome}
#
# ============================================================
# EFEITOS ANIMADOS
# ============================================================
# Os efeitos funcionam separadamente ou junto com <small>.
#
# <small>UTILIDADESPLUS</small>
#   Converte somente este trecho para Small Caps.
#
# <carregamento:3>UTILIDADESPLUS</carregamento>
#   Uma cor branca percorre o texto do começo ao fim.
#   Depois o texto pisca 3 vezes e volta à cor original.
#   O número define a quantidade de piscadas.
#   Se omitido, usa 3: <carregamento>texto</carregamento>
#
# <brilho>texto</brilho>
#   Um brilho branco passa continuamente pelo texto.
#
# <pulso>texto</pulso>
#   O texto pulsa entre a cor original e branco.
#
# <piscar:3>texto</piscar>
#   Faz o texto piscar a quantidade de vezes informada.
#
# <onda>texto</onda>
#   Uma onda de brilho percorre o texto da esquerda para a direita.
#
# <onda-reversa>texto</onda-reversa>
#   Uma onda de brilho percorre o texto da direita para a esquerda.
#
# <arcoiris>texto</arcoiris>
#   Aplica um arco-íris animado que percorre o texto.
#
# <arcoiris-pulso>texto</arcoiris-pulso>
#   Arco-íris animado com uma variação de pulso.
#
# <fade>texto</fade>
#   Faz o texto aparecer e desaparecer suavemente.
#
# <shake>texto</shake>
#   Move horizontalmente o texto em pequenos passos.
#
# ============================================================
# COMBINAÇÕES
# ============================================================
# Small Caps + efeito:
# <small><carregamento:3>UTILIDADESPLUS</carregamento></small>
#
# Efeito + Small Caps:
# <carregamento:3><small>UTILIDADESPLUS</small></carregamento>
#
# Vários trechos podem usar efeitos diferentes na mesma linha.
# ============================================================
# ============================================================

# Ativa ou desativa o TAB inteiro.
ativado: true

# ============================================================
# HEADER
# ============================================================
# O header aparece acima da lista de jogadores.
#
# header-ativado:
#   true  = mostra o header
#   false = não mostra o header
#
# Tudo dentro de "header" é configurável.
# Você pode adicionar, remover ou reorganizar quantas linhas quiser.
# ============================================================

header-ativado: true

header: |
  &8━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  <gradient:#7C3AED:#22D3EE><small>UTILIDADESPLUS</small></gradient>
  &7Bem-vindo, &f%player_name%&7!
  &8
  &7Temporada: &f1
  &8━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ============================================================
# FOOTER
# ============================================================
# O footer aparece abaixo da lista de jogadores.
#
# footer-ativado:
#   true  = mostra o footer
#   false = não mostra o footer
#
# Tudo dentro de "footer" é configurável.
# Você pode alterar completamente o conteúdo do footer.
#
# Placeholders disponíveis:
# %online%       = jogadores online
# %max%          = limite máximo de jogadores
# %ping%         = ping do jogador
# %ip%           = endereço configurado abaixo
# %player_name%  = nome do jogador
# ============================================================

footer-ativado: true

footer: |
  &8━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  &7Jogadores online: &a%online%&7/&f%max%
  &7Seu ping: &a%ping%ms
  &8
  <gradient:#22D3EE:#7C3AED><small>UTILIDADESPLUS</small></gradient>
  &7Obrigado por jogar!
  &8━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ============================================================
# NOMES DOS JOGADORES
# ============================================================
# Define como o nome de cada jogador aparece na lista.
#
# Placeholders:
# %prefix%       = prefixo do cargo
# %name_color%   = cor do nome
# %player_name%  = nome do jogador
# %clan_tag%     = tag do clan
# %group%        = grupo/cargo
# ============================================================

jogadores:
  formato: "%prefix%%name_color%%player_name%%clan_tag%"

# ============================================================
# TAG / CLAN
# ============================================================

tag:
  ativada: true
  mostrar-no-tab: true
  mostrar-na-cabeca: false

# ============================================================
# ORDENAÇÃO DOS JOGADORES
# ============================================================

sorting:
  enabled: true
  case-sensitive: false

  rules:
    - type: primary-group
      order: ascending

    - type: placeholder
      placeholder: "%player_name%"
      order: ascending
      case-sensitive: false

# ============================================================
# ENDEREÇO DO SERVIDOR
# ============================================================
# Usado pelo placeholder %ip%.
# ============================================================

endereco-servidor: ""

# ============================================================
# UtilidadesPlus - TAB
# ============================================================
# Toda a identidade visual do TAB pode ser alterada aqui.
# Não é necessário editar o código Java para trocar textos,
# cores, linhas, placeholders ou o efeito do footer.
#
# Cores: &a, &b, &c...
# Gradiente: <gradient:#7C3AED:#22D3EE>texto</gradient>
# Ícones: {icon:nome}
# ============================================================

# Liga/desliga o sistema completo do TAB.
ativado: true

# ============================================================
# HEADER
# ============================================================
# O header aparece na parte superior da lista de jogadores.
#
# header-ativado:
#   true  = mostra o header
#   false = esconde o header
#
# Tudo dentro de "header" é editável.
header-ativado: true

header: |
  <gradient:#7C3AED:#22D3EE>SEU SERVIDOR</gradient> {icon:estrela}
  &7ᴛᴇᴍᴘᴏʀᴀᴅᴀ: &f1
  &8
  &fBem-vindo(a) ao servidor!

# ============================================================
# FOOTER
# ============================================================
# O footer aparece na parte inferior da lista de jogadores.
#
# footer-ativado:
#   true  = mostra o footer
#   false = esconde o footer
#
# O footer normal é usado quando a animação estiver desligada.
footer-ativado: true

footer: |
  &8━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  &7Jogadores online: &a%online%&7/&f%max%
  &7Seu ping: &a%ping%ms
  &8
  <gradient:#22D3EE:#7C3AED>SEU SERVIDOR</gradient>
  &8━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ============================================================
# FOOTER ANIMADO
# ============================================================
# Ative para substituir o footer normal por um efeito.
#
# efeitos disponíveis:
#   alternancia
#   pulso
#   arco-iris
#   deslizante
#   personalizado
footer-animado:
  ativado: true
  efeito: "alternancia"
  intervalo-segundos: 3

  # ----------------------------------------------------------
  # PREDEFINIÇÕES
  # ----------------------------------------------------------
  # Você pode alterar livremente os textos, cores e tamanhos.

  predefinicoes:

    # Troca a cor da barra e da mensagem.
    alternancia:
      espacos-centralizacao: "                    "
      texto: "Servidor online!"
      cores:
        - "&c"
        - "&9"
        - "&a"

    # Alterna entre duas cores.
    pulso:
      espacos-centralizacao: "                    "
      texto: "Servidor online!"
      cor-inicial: "&c"
      cor-final: "&f"

    # Percorre as cores configuradas.
    arco-iris:
      espacos-centralizacao: "                    "
      texto: "Servidor online!"
      cores:
        - "&c"
        - "&6"
        - "&e"
        - "&a"
        - "&b"
        - "&9"
        - "&d"

    # Move o texto horizontalmente.
    deslizante:
      espacos-centralizacao: "                    "
      texto: "SEU SERVIDOR"
      cor: "&b"
      largura: 24

  # ----------------------------------------------------------
  # EFEITO PERSONALIZADO
  # ----------------------------------------------------------
  # Use efeito: "personalizado" para controlar cada frame.
  #
  # Cada estado pode ter:
  #   espacos-centralizacao
  #   riscos
  #   mensagem
  #
  # Exemplo:
  #   barra vermelha + mensagem vermelha
  #   depois barra azul + mensagem azul
  #   depois barra verde + mensagem verde
  estados:

    - espacos-centralizacao: "                    "
      riscos: "&c━━━━━━━━━━━━━━━━━━━━━━━━"
      mensagem: "&cServidor online!"

    - espacos-centralizacao: "                    "
      riscos: "&9━━━━━━━━━━━━━━━━━━━━━━━━"
      mensagem: "&9Servidor online!"

    - espacos-centralizacao: "                    "
      riscos: "&a━━━━━━━━━━━━━━━━━━━━━━━━"
      mensagem: "&aServidor online!"

# ============================================================
# NOMES DOS JOGADORES
# ============================================================
# Formato usado para o nome de cada jogador no TAB.
#
# Placeholders:
# %prefix%
# %name_color%
# %player_name%
# %clan_tag%
# %group%
jogadores:
  formato: "%prefix%%name_color%%player_name%%clan_tag%"

# ============================================================
# TAG / CLAN
# ============================================================
tag:
  ativada: true
  mostrar-no-tab: true
  mostrar-na-cabeca: false

# ============================================================
# ORDENAÇÃO DOS JOGADORES
# ============================================================
sorting:
  enabled: true
  case-sensitive: false

  rules:
    - type: primary-group
      order: ascending

    - type: placeholder
      placeholder: "%player_name%"
      order: ascending
      case-sensitive: false

# ============================================================
# ENDEREÇO DO SERVIDOR
# ============================================================
# Usado pelo placeholder %ip%.
# Deixe vazio se não quiser informar endereço.
endereco-servidor: ""

# ============================================================
# NOMES DOS JOGADORES
# ============================================================

jogadores:
  formato: "%prefix%%name_color%<small>%player_name%</small>%clan_tag%"

# ============================================================
# TAG / CLAN
# ============================================================

tag:
  ativada: true
  mostrar-no-tab: true

  cabeca:
    ativada: true
    formato: "%prefixo%%name_color%%player_name%%clan%%invisivel%"

    prefixo:
      formato: "%prefix%"

    nome:
      formato: "%name_color%%player_name%"

    clan:
      formato: " &r%clan_tag%"

    invisivel:
      ativado: true
      abaixo-do-nome: true
      centralizar-automaticamente: true
      espacos-extra: 0
      espacos-centralizacao: "       "
      formato: " &r%vanish_suffix%"
      texto: "[INVISIVEL]"
      cor: "&c"

# ============================================================
# ORDENAÇÃO DOS JOGADORES
# ============================================================

sorting:
  enabled: true
  case-sensitive: false

  rules:
    - type: primary-group
      order: ascending

    - type: placeholder
      placeholder: "%player_name%"
      order: ascending
      case-sensitive: false

# ============================================================
# ENDEREÇO DO SERVIDOR
# ============================================================

endereco-servidor: ""
